{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Activation Expired" %} — FOSDEM Volunteers{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-16">
  <div class="text-5xl mb-4">⏰</div>
  <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">{% trans "Activation Link Expired" %}</h1>
  <p class="text-gray-600 dark:text-gray-300 mb-6">{% trans "Your activation link has expired." %}</p>
  <a href="{% url 'userena_activate_retry' activation_key %}"
     class="bg-fosdem hover:bg-fosdem-dark text-white px-6 py-2.5 rounded-lg font-semibold transition-colors">
    {% trans "Request a new activation link" %}
  </a>
</div>
{% endblock %}
