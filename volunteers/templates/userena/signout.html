{% extends "base.html" %}
{% load i18n %}
{% block title %}Signed Out — FOSDEM Volunteers{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-16">
  <div class="text-5xl mb-4">👋</div>
  <h1 class="text-2xl font-bold text-gray-900 dark:text-dm-text mb-2">{% trans "You've been logged out" %}</h1>
  <p class="text-gray-600 dark:text-dm-text mb-6">Thank you for volunteering at FOSDEM!</p>
  <a href="{% url 'login' %}" class="bg-fosdem hover:bg-fosdem-dark text-white px-6 py-2.5 rounded-lg font-semibold transition-colors">{% trans "Log In Again" %}</a>
</div>
{% endblock %}
