{% extends "base.html" %}
{% load i18n %}
{% block title %}Resend Activation — FOSDEM Volunteers{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-lm-bg dark:bg-dm-soft rounded-xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-lm-text dark:text-dm-text mb-2">Resend Activation Link</h1>
    <p class="text-lm-muted dark:text-dm-text text-sm mb-6">Enter your email address and we'll resend your account activation link.</p>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit"
              class="w-full bg-fosdem hover:bg-fosdem-dark text-white font-semibold py-2.5 rounded-lg transition-colors">
        Send Activation Email
      </button>
    </form>
  </div>
</div>
{% endblock %}
