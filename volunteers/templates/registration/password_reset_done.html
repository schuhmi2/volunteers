{% extends "base.html" %}
{% block title %}Password Reset Sent — FOSDEM Volunteers{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-lm-bg dark:bg-dm-soft rounded-xl shadow-lg p-8 text-center">
    <div class="text-5xl mb-4">📧</div>
    <h1 class="text-2xl font-bold text-lm-text dark:text-dm-text mb-2">Check Your Email</h1>
    <p class="text-lm-muted dark:text-dm-text">
      We've sent a password reset link to your email address. Please check your inbox and follow the instructions.
    </p>
    <a href="{% url 'login' %}" class="mt-6 inline-block text-fosdem hover:underline text-sm">Back to Log In</a>
  </div>
</div>
{% endblock %}
