{% extends "base.html" %}
{% block title %}Password Reset Complete — FOSDEM Volunteers{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-lm-bg dark:bg-dm-soft rounded-xl shadow-lg p-8 text-center">
    <div aria-hidden="true" class="text-5xl mb-4">✅</div>
    <h1 class="text-2xl font-bold text-lm-text dark:text-dm-text mb-2">Password Reset Complete</h1>
    <p class="text-lm-muted dark:text-dm-text mb-6">Your password has been set. You can now sign in with your new password.</p>
    <a href="{% url 'login' %}" class="bg-fosdem hover:bg-fosdem-dark text-white px-6 py-2.5 rounded-lg font-semibold transition-colors">Log In</a>
  </div>
</div>
{% endblock %}
